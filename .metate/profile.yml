# .metate/profile.yml — per-repo config for the `metate` pipeline.
# The skill engines are codebase-agnostic; everything project-specific lives here.

# --- gates ---------------------------------------------------------------
# T10: swift run watchdog-tests exercises the extracted watchdog verdict function.
# Requires macOS 14+ with swift CLI (CLT sufficient; full Xcode not required).
fastGate: "uv run ruff check . && uv run pytest && (cd swift-audio-capture && swift build -c release && ./.build/release/watchdog-tests)"
shipGate: "uv run ruff check . && uv run mypy . && uv run pytest && (cd swift-audio-capture && swift build -c release && ./.build/release/watchdog-tests)"

# --- implementer (the only writer) ---------------------------------------
implementer:
  backend: claude          # cursor | codex | claude | gemini
  model: claude-sonnet-4-6 # blank = adapter default
  autonomous: false        # claude backend only. true → bootstrap whitelists `Bash(claude -p:*)`

sessionFile: ".metate/session.json"
isolation: none            # none | worktree

# --- review (metate-review) -----------------------------------------------
# Real invariants for THIS codebase, drawn from ROADMAP.md guiding principles
# and Epic #12 (backend hardening). These are the actual failure modes.
reviewFocus: |
  - Shared mutable state (app_state in server.py) must be guarded — no
    unsynchronized concurrent reads/writes; recording start/stop is single-writer
    (one active session, never two). Model-download state must be atomic.
  - DB mutations that span rows (split_session / merge_sessions in database.py)
    run inside a single transaction + lock — never leave sessions/segments half-moved.
  - LLM calls never hang the UI: mlx-lm calls serialized; Gemini/Claude calls have
    a timeout and bounded retry/backoff. Failures degrade gracefully, don't crash.
  - Local-first: on-device transcription/summarization is the default; cloud
    providers (Gemini/Claude) stay strictly opt-in and never required to run.
  - No framework creep: dashboard stays a single-file stdlib SPA (no bundler);
    server stays stdlib http.server. Don't introduce frameworks casually.
  - Core-loop changes (server.py, database.py, session.py) ship with tests.
  - .env values never carry inline comments (python-dotenv parses them into the value).

# --- prep (metate-prep) ---------------------------------------------------
prep:
  baseBranch: main
  readingOrder:            # docs to read before building, in order
    - ROADMAP.md
    - CLAUDE.md
    - README.md
  techDebtFile: "ROADMAP.md"   # backlog + Epic #12 hardening items live here
  issues:                  # file the issue ledger from the text plan at sprint start
    create: true           # false = ledger is managed outside metate
    tracker: github        # gh CLI
    granularity: test-matrix  # one issue per DoD test-matrix item (T1…Tn)
    labels: ["sprint"]     # applied to every filed issue
    milestone: ""          # blank = none

# --- assumption probe (runs BEFORE build/review) ---------------------------
# Added 2026-09-01 after the `tap-profile-switch-recovery` post-mortem.
#
# That sprint spent nine review rounds (2026-08-21, 13:48→17:05) hardening a
# silence-based watchdog. On 2026-08-22 a single live run invalidated the whole
# design — silence is not a tap failure, and rebuilding on it glitches playback.
# The load-bearing function was rewritten (+153/-289) and its entire test suite
# deleted. No review round could have caught it: TCC denies the audio grant to
# non-app processes, so the only environment that can observe the fault is the
# signed bundle, and that is the SMOKE stage, which runs AFTER review.
#
# The information order was inverted: the cheapest, most decisive signal sat
# behind the most expensive gate. This section moves it forward.
assumptions:
  # Any plan whose design rests on behaviour that only real hardware, a signed
  # bundle, a TCC grant or a live external service can exhibit must list that
  # behaviour in a "Load-bearing assumptions" section of the plan, with a probe
  # and a verdict field per row.
  require: when-hardware-observable
  probeBeforeReview: true   # an unprobed load-bearing row blocks entry to review
  # Cost discipline: a probe is one run, minutes, answering one question. It is
  # not a smoke pass. If a row cannot be probed cheaply, say so in the plan and
  # carry it as a stated risk rather than an assumed fact.
  recordIn: ".metate/plan.md"

# --- smoke (metate-smoke) -------------------------------------------------
# No automated e2e suite (menubar app). Behavior proof = run the app and exercise
# the record → transcribe → summarize loop in the dashboard.
smoke:
  command: "uv run escriba app"   # launch app + dashboard at http://127.0.0.1:19876
  seedCommand: ""                 # n/a — no fixture seed
  humanGates:                     # hardware-only criteria, walked by the user
    - id: T12
      doc: ".metate/t12-listener-check.md"
      issue: 217
      why: "The only recovery path covering the recorded failure. Cannot be verified headlessly — a terminal tap reads digital zeros under TCC."

# --- aftercare (metate-aftercare) -----------------------------------------
aftercare:
  release:
    enabled: true
    scheme: semver
    tagPrefix: "v"
    currentFrom: git-tag     # tags + GitHub Releases are the published artifact
    githubRelease: true
    # This repo ALSO carries the version in pyproject.toml, and the in-app
    # updater (escriba.app.updates) compares the installed __version__ against
    # GitHub releases/latest. If the tag moves and the version file does not,
    # the app prompts users to "update" to the code they are already running.
    # So a release here means: bump pyproject.toml + the src/escriba/__init__.py
    # fallback in the sprint PR, and let ship cut the tag after merge.
    versionFile: "pyproject.toml"
    planFile: ".metate/release.json"
  deliverables:
    - ROADMAP.md           # update milestone checkboxes / "Where we are"
    - CHANGELOG.md         # create/append the release feature list
    - README.md            # keep feature list + version current

# --- ship (metate-ship) ---------------------------------------------------
ship:
  prTarget: main
  commitStyle: "conventional, bisectable, one per layer"
  issueCloseKeyword: "Closes"   # PR body keyword for auto-close
issueLedger: ".metate/issues.json"   # issues filed by prep, read by ship for auto-close
codebaseMemory:
  enabled: true            # codebase-memory-mcp wired + repo indexed (project Users-skalas-github-skalas-escriba)
  reindex: git             # git | always | manual — refresh the graph between rounds after the implementer patches
  indexCommand: ""         # blank = rely on the auto_index git watcher; else an explicit reindex command
review:
  autoFix: all
  maxRounds: 3             # the engine's cap — see enforce below
  # `tap-profile-switch-recovery` ran NINE rounds. Rounds 4-9 ran outside
  # metate-review and left no artifacts in .metate/review/, so the cap never
  # applied. The cap is not bureaucracy: it is the signal to stop polishing and
  # go get real feedback. Had it fired at round 3, the 2026-08-22 correction
  # would have arrived before six more rounds of hardening the wrong design.
  enforce: artifacts       # every round must write .metate/review/round<N>-findings.json
  onCapReached: go-to-smoke  # a 4th round is a smoke trip, not another round
  # A design change invalidates the acceptance criteria. metate had no step that
  # reconciled the two, which is how T1 came to assert the exact opposite of the
  # code while issue #205 still carried the original wording and would have been
  # auto-closed by the PR.
  onDesignChange: rederive-dod   # editing the plan's design marks the DoD stale
  dodStaleBlocksShip: true       # ship refuses until T* and the ledger agree
discover:
  signals:                 # which sources to sweep for candidate work
    aftercare: true        # last sprint's deliverables (roadmap, next-sprint pointers) — the loop-closing input
    codebaseMemory: true   # graph: dead code, high fan-out, churn, coverage gaps (needs codebaseMemory.enabled)
    issues: true           # open gh issues + techDebtFile items whose trigger has fired
    gitHistory: true       # churn hotspots + TODO/FIXME/HACK scan (cheapest, noisiest)
  planFile: ".metate/plan.md"   # discover writes here; prep reads it as its entry doc
  candidates: 5            # how many ranked candidates to propose
orchestrator:
  backend: claude          # claude | codex | cursor
